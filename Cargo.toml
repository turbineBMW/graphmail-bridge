[package]
name = "graphmail-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Microsoft Graph to local IMAP/SMTP bridge"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = "0.12"
directories = "6.0"
keyring = "4.1"
mail-parser = "0.11"
mailrs-imap-proto = "2.0"
oauth2 = "5.0"
open = "5.4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.0", features = ["full"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
